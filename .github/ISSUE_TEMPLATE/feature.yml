name: '✨ 기능 · 개선'
description: '새 기능, 기존 기능 개선, 설정 · 문서 작업'
labels: ['enhancement']
body:
  - type: dropdown
    id: area
    attributes:
      label: '영역'
      options:
        - 프론트 (apps/mobile)
        - 백엔드 (apps/api)
        - AI서버 (apps/ai)
        - 인프라 (infra)
        - 공용 (packages/shared)
        - CI · 설정
        - 문서
    validations:
      required: true
  - type: input
    id: fr
    attributes:
      label: '요구사항 번호'
      placeholder: '예: FR-37 (없으면 비워 둔다)'
  - type: textarea
    id: background
    attributes:
      label: '배경'
      description: '무엇을, 왜 하는지'
    validations:
      required: true
  - type: textarea
    id: todo
    attributes:
      label: '할 일'
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: '완료 조건'
      value: |
        - [ ]
    validations:
      required: true
