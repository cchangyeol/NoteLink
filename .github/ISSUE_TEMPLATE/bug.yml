name: '🐞 버그'
description: '기존 동작의 오류나 예외 상황'
labels: ['bug']
body:
  - type: dropdown
    id: area
    attributes:
      label: '영역'
      options:
        - 프론트 (apps/mobile)
        - 백엔드 (apps/api)
        - AI서버 (apps/ai)
        - 인프라 (infra)
        - 공용 (packages/shared)
        - CI · 설정
        - 문서
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: '문제 상황'
      placeholder: '무엇이 잘못 동작하나요?'
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: '재현 방법'
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: '기대 동작'
      placeholder: '정상이라면 어떻게 동작해야 하나요?'
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: '근거'
      placeholder: '오류 메시지, 로그, 화면 캡처, 기기 · OS'
  - type: textarea
    id: done
    attributes:
      label: '완료 조건'
      value: |
        - [ ] 원인을 확인했다
        - [ ] 재현 방법으로 다시 해 봐도 문제가 없다
        - [ ] 같은 문제를 막는 테스트를 추가했다
    validations:
      required: true
