# develop · main으로 가는 PR에 Codex 리뷰를 자동으로 남깁니다 (scripts/codex-review.sh).
# 리뷰 전용 컴퓨터(self-hosted runner, 라벨 codex)에서 돌고, 댓글은 그 컴퓨터의 gh에 로그인한 계정으로 남습니다.
# GITHUB_TOKEN은 넘기지 않습니다. 넘기면 댓글 작성자가 봇이 되어 지난 리뷰를 찾지 못합니다(재리뷰가 깨짐).
# pull_request_target: 이 파일과 스크립트는 PR의 대상 브랜치와 상관없이 기본 브랜치(main)의 것을 씁니다.
# 이 파일이 main에 있어야 develop으로 가는 PR에서도 돌고, 고친 내용도 main에 들어가야 적용됩니다.
# PR이 이 워크플로나 스크립트를 바꿔도 리뷰 컴퓨터에서는 실행되지 않습니다.
# PR 코드(AGENTS.md 포함)는 Codex가 읽기 전용으로 보지만 Codex의 입력이
# 되므로, 리뷰 댓글은 참고용으로 보고 최종 판단은 리뷰어가 합니다.
# 필수 검사가 아니므로 리뷰 컴퓨터가 꺼져 있어도 병합은 막히지 않습니다(그때는 리뷰어가 직접 돌립니다).
name: Codex 리뷰

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [develop, main]

permissions:
  contents: read

# 같은 PR에 push가 이어지면 앞 리뷰를 멈추고 마지막 커밋만 리뷰합니다.
concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Codex 리뷰
    # 포크 PR(외부인) · 초안 · Dependabot은 건너뜁니다.
    # pull_request_target에는 "외부 기여자 승인" 설정이 적용되지 않으므로 포크는 여기서 막습니다.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: [self-hosted, codex]
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      # 기본 브랜치(main)를 받습니다. 리뷰할 PR과 대상 브랜치는 스크립트가 직접 받습니다.
      # 재리뷰 때 지난 리뷰 커밋과 비교하도록 기록 전체를 받습니다.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 리뷰 컴퓨터 확인
        run: |
          # Windows에서 PATH 순서가 바뀌면 Git Bash 대신 WSL bash가 잡힐 수 있습니다.
          if [ "${{ runner.os }}" = "Windows" ] && [ "$OSTYPE" != "msys" ]; then
            echo "::error::Git Bash가 아닌 bash($OSTYPE)로 실행됐습니다. 시스템 PATH 맨 위에 C:\\Program Files\\Git\\bin을 두세요."
            exit 1
          fi
          for c in git gh codex; do
            command -v "$c" > /dev/null || { echo "::error::$c 를 찾을 수 없습니다. 리뷰 컴퓨터의 시스템 PATH를 확인하세요."; exit 1; }
          done
          login=$(gh api user --jq .login)
          echo "bash  $BASH_VERSION ($(command -v bash))"
          echo "codex $(codex --version) ($(command -v codex))"
          echo "gh    $(gh --version | head -n 1), 로그인: $login"
          codex login status

      # 취소된 지난 실행이 남긴 임시 worktree 기록을 정리합니다.
      - name: 지난 실행 정리
        run: git worktree prune

      - name: 리뷰
        env:
          PR: ${{ github.event.pull_request.number }}
          # 스크립트의 임시 폴더(mktemp)를 러너 작업용 임시 폴더에 둡니다. 러너가 작업마다 비우므로
          # 취소된 실행이 남긴 폴더도 쌓이지 않습니다.
          TMPDIR: ${{ runner.temp }}
        run: scripts/codex-review.sh "$PR"
